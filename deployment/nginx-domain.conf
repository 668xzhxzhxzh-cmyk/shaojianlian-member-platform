# 备案域名 + HTTPS 生产配置模板（本文件不直接生效，按步骤部署）
# 1. 把 {your-filed-domain} 替换为已备案域名；在 DNS 服务商添加 A 记录指向 ECS 公网 IP。
# 2. 安装证书：certbot --nginx -d {your-filed-domain}（自动续期），或阿里云免费证书后手动填路径。
# 3. 用本文件替换 /etc/nginx 中的 IP 验收配置，nginx -t 通过后 systemctl reload nginx。
# 4. 同步更新：
#    - /opt/shao-coach/.env：SITE_ADDRESS/PUBLIC_URL 改为 https://{your-filed-domain}，COOKIE_SECURE=true
#    - /etc/default/shao-coach-web：NEXT_PUBLIC_SITE_URL 改为 https://{your-filed-domain}
#    - Supabase 不需要（本项目用自建 PostgreSQL）；企业微信回调 URL 改为 https://{your-filed-domain}/api/wecom/callback
# 5. 验证：curl -I https://{your-filed-domain}/health 应返回 200 且带 HSTS/CSP 头。

limit_req_zone $binary_remote_addr zone=shao_auth:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name {your-filed-domain};
    # 企业微信验证与 HTTP 健康检查用，其余 301 到 HTTPS
    location = /health {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {your-filed-domain};
    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/{your-filed-domain}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{your-filed-domain}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /health {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    # 内部 Hermes 工具端点只允许服务器回环直连，公网一律 404。
    location ^~ /api/internal/ {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=shao_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    location = /api/auth/register {
        limit_req zone=shao_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }
}
