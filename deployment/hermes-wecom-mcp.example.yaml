# 合并到 /var/lib/hermes/.hermes/config.yaml。
# 真实令牌只放 /var/lib/hermes/.hermes/.env，不要写入本文件。
model:
  # DeepSeek V4 Flash 官方上下文为 1M；Hermes 至少要求 64K。
  context_length: 1000000

mcp_servers:
  shao-coach:
    command: /var/lib/hermes/.hermes/hermes-agent/venv/bin/python
    args:
      - /var/lib/hermes/.hermes/tools/shao_coach_mcp.py
    env:
      SHAO_INTERNAL_API_URL: http://127.0.0.1:8788/api/internal/hermes/tools
      SHAO_HERMES_TOOL_TOKEN: ${env:HERMES_TOOL_TOKEN}
      WECOM_ALLOWED_COACH_USERIDS: ${env:WECOM_ALLOWED_COACH_USERIDS}
    enabled: true
    tools:
      include:
        - get_member_by_id
        - list_members
        - add_private_session
        - update_private_session
        - delete_private_session
        - update_training_plan
        - update_nutrition_plan
        - add_body_feedback
        - update_member_profile
        - get_member_change_history
        - list_customer_ids
        - create_member_binding_qr
        - bind_member_external_userid
        - create_member_message_draft
        - create_member_message
        - confirm_customer_send_task
        - get_customer_send_task_status

# 同一个 MCP 对企业微信自建应用回调、网站 Hermes 对话和 Hermes Desktop 开放。
# 三个入口都由服务器固定唯一教练身份，会员修改仍必须使用精确 member_id。
platform_toolsets:
  api_server:
    - shao-coach
  cli:
    - shao-coach
