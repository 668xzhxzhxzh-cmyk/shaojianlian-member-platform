# 合并到 /var/lib/hermes/.hermes/config.yaml。
# 真实令牌只放 /var/lib/hermes/.hermes/.env，不要写入本文件。
mcp_servers:
  shao-coach:
    command: /var/lib/hermes/.hermes/hermes-agent/venv/bin/python
    args:
      - /var/lib/hermes/.hermes/tools/shao_coach_mcp.py
    env:
      SHAO_INTERNAL_API_URL: http://127.0.0.1:8788/api/internal/hermes/tools
      SHAO_HERMES_TOOL_TOKEN: ${env:HERMES_TOOL_TOKEN}
      WECOM_ALLOWED_COACH_USERIDS: ${env:WECOM_ALLOWED_USERS}
    enabled: true
    tools:
      include:
        - get_member_by_id
        - list_customer_ids
        - bind_member_external_userid
        - create_member_message_draft
        - confirm_customer_send_task
        - get_customer_send_task_status

# MCP 只对企业微信 AI Bot 开放。网站 API、CLI 和其他平台不加载会员管理工具。
platform_toolsets:
  wecom:
    - shao-coach

# 最终生产策略：私聊只允许唯一教练；群聊同时校验精确 chatid 和教练 userid。
# 第一次在目标群 @ 机器人后，从 Hermes 会话元数据取得 chatid，再运行：
# sudo /usr/local/sbin/shao-wecom-lock-group <chatid>
platforms:
  wecom:
    enabled: true
    extra:
      dm_policy: allowlist
      allow_from:
        - REPLACE_WITH_COACH_USERID
      group_policy: allowlist
      group_allow_from:
        - REPLACE_WITH_AUTHORIZED_GROUP_CHATID
      groups:
        REPLACE_WITH_AUTHORIZED_GROUP_CHATID:
          allow_from:
            - REPLACE_WITH_COACH_USERID
