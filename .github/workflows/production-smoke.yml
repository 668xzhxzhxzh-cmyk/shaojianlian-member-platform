name: Production integration smoke checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliyun-production-smoke
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out verification script
        uses: actions/checkout@v7

      - name: Configure SSH without printing credentials
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Run real vision provider probe from ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          scp scripts/verify-vision-runtime.mjs "$ECS_USER@$ECS_HOST:/tmp/shao-verify-vision.mjs"
          ssh "$ECS_USER@$ECS_HOST" \
            "node /tmp/shao-verify-vision.mjs /opt/shao-coach/.env /opt/shao-coach/current/server/hermes-vision.mjs"

      - name: Remove temporary verification script
        if: always()
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: ssh "$ECS_USER@$ECS_HOST" "rm -f /tmp/shao-verify-vision.mjs"
