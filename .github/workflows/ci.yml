name: CI

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies on GitHub Runner
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build standalone production website
        run: npm run build:node

      - name: Package complete Linux production runtime
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/package-production.sh

      - name: Verify package structure and secret exclusions
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          bash scripts/verify-release-archive.sh \
            "artifacts/shao-production-linux-${RELEASE_SHA}.tar.gz" \
            "${RELEASE_SHA}"

      - name: Dry-run release controller without production access
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          bash scripts/release-deploy.sh \
            --dry-run \
            --release-sha "${RELEASE_SHA}" \
            --release-tar "artifacts/shao-production-linux-${RELEASE_SHA}.tar.gz"

      - name: Validate Docker configuration without production secrets
        run: |
          cp .env.example .env
          docker compose config >/dev/null
        env:
          POSTGRES_PASSWORD: ci-only-password

      - name: Upload immutable production artifact
        uses: actions/upload-artifact@v4
        with:
          name: shao-production-linux-${{ github.sha }}
          path: |
            artifacts/shao-production-linux-${{ github.sha }}.tar.gz
            artifacts/shao-production-linux-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
